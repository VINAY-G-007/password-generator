[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "password-generator"
version = "1.0.0"
description = "A small command-line tool that generates strong random passwords with Python's secrets module."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinay G Jampannanavar" }]

[project.scripts]
passgen = "password_gen:main"

[tool.setuptools]
py-modules = ["password_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
